<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>
</head>
<body>
    <table>
        <tr>
            <td>Name</td>
        </tr>
        <tr>
            <td><input type="text" id="name"></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit" onclick="test()"></td>
        </tr>
    </table>
    <p id="error" style="color: red;"></p>
    <div id="body"></div>

    <script>
    function test() {
        let name = document.getElementById('name').value;
        let error = document.getElementById('error');
        let body = document.getElementById('body');

        let validChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.- ";
        let wordCount = 0;
        let inWord = false;

        if (name === "") {
            error.innerHTML = "Please type a name.";
            return;
        }

        if (!(name[0] >= 'a' && name[0] <= 'z') && !(name[0] >= 'A' && name[0] <= 'Z')) {
            error.innerHTML = "Name must start with a letter.";
            return;
        }

        for (let i = 0; i < name.length; i++) {
            let char = name[i];

            if (validChars.indexOf(char) === -1) {
                error.innerHTML = "Name can only contain letters, dot (.), or dash (-).";
                return;
            }

            if (char !== " ") {
                if (!inWord) {
                    wordCount++;
                    inWord = true;
                }
            } else {
                inWord = false;
            }
        }

        if (wordCount < 2) {
            error.innerHTML = "Name must contain at least two words.";
            return;
        }

        error.innerHTML = "";
        body.innerHTML = "Welcome " + name;
        body.style.color='blue';
    }
    </script>
</body>
</html>
